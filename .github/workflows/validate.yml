name: Validate JSON & Schema

on:
  pull_request:
    paths:
      - 'data/**'
      - 'schemas/**'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'schemas/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Validate JSON syntax
        run: |
          python3 << 'EOF'
          import json
          import sys
          import os
          
          files_to_check = [
              'data/sample-tools.json',
              'data/sample-lboxx.json',
              'data/sample-inlays.json',
              'data/sample-collection.json',
              'schemas/tools-schema.json',
              'schemas/lboxx-schema.json',
              'schemas/inlays-schema.json',
              'schemas/collection-schema.json'
          ]
          
          all_valid = True
          for file_path in files_to_check:
              if os.path.exists(file_path):
                  try:
                      with open(file_path, 'r', encoding='utf-8') as f:
                          json.load(f)
                      print(f"✓ {file_path} is valid JSON")
                  except json.JSONDecodeError as e:
                      print(f"✗ {file_path} has invalid JSON: {e}")
                      all_valid = False
              else:
                  print(f"⚠ {file_path} not found (skipping)")
          
          if not all_valid:
              sys.exit(1)
          EOF
      
      - name: Install jsonschema
        run: pip install jsonschema
      
      - name: Validate against schemas
        run: |
          python3 << 'EOF'
          import json
          import sys
          from jsonschema import validate, ValidationError
          
          validation_pairs = [
              ('data/sample-tools.json', 'schemas/tools-schema.json', 'tools'),
              ('data/sample-lboxx.json', 'schemas/lboxx-schema.json', 'L-Boxx'),
              ('data/sample-inlays.json', 'schemas/inlays-schema.json', 'inlays'),
              ('data/sample-collection.json', 'schemas/collection-schema.json', 'collections')
          ]
          
          all_valid = True
          for data_file, schema_file, name in validation_pairs:
              try:
                  with open(data_file, 'r') as f:
                      data = json.load(f)
                  with open(schema_file, 'r') as f:
                      schema = json.load(f)
                  
                  validate(instance=data, schema=schema)
                  print(f"✓ {name} data validates against schema")
              except ValidationError as e:
                  print(f"✗ {name} schema validation failed: {e.message}")
                  all_valid = False
              except FileNotFoundError as e:
                  print(f"⚠ {data_file} or {schema_file} not found (skipping)")
          
          if not all_valid:
              sys.exit(1)
          EOF
      
      - name: Check file sizes
        run: |
          python3 << 'EOF'
          import os
          
          max_size = 10 * 1024 * 1024  # 10 MB
          
          for file_path in ['data/sample-tools.json', 'data/sample-lboxx.json', 'data/sample-inlays.json', 'data/sample-collection.json']:
              if os.path.exists(file_path):
                  size = os.path.getsize(file_path)
                  size_mb = size / (1024 * 1024)
                  
                  if size > max_size:
                      print(f"✗ {file_path} is {size_mb:.2f}MB (max 10MB)")
                      exit(1)
                  else:
                      print(f"✓ {file_path} is {size_mb:.2f}MB")
          EOF
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ JSON validation passed!\n- All JSON files syntactically valid\n- All data validated against schemas\n- File sizes within limits'
            })
