name: Pages Smoke Checks

on:
  push:
    branches:
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          python3 << 'EOF'
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          if '<!DOCTYPE html>' in content and '<html' in content:
              print("✓ index.html looks valid")
          else:
              print("✗ index.html missing DOCTYPE or html tag")
              exit(1)
          EOF

      - name: Check for critical files
        run: |
          required_files=(
            "index.html"
            "main.js"
            "data/tools.json"
            "data/lboxx.json"
            "styles/main.css"
            "lib/fuse.js"
            "js/modules/ui.js"
            "js/modules/search.js"
            "js/modules/results.js"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "✗ Missing required file: $file"
              exit 1
            fi
            echo "✓ Found: $file"
          done

      - name: Post smoke checks
        run: |
          echo "✅ Pages smoke checks passed."
          echo ""
          echo "Run details:"
          echo "- Repository: ${{ github.repository }}"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Commit: ${{ github.sha }}"
          echo "- Actor: ${{ github.actor }}"
